# Conditions of the TU Delft test flight of 7 May 2013 (Valkenburg, 25 m^2 LEI kite,
# moderate wind), as reported by van der Vlugt, Bley, Noom & Schmehl (2019),
# "Quasi-steady model of a pumping kite power system", Renewable Energy 131,
# arXiv:1705.04133, Tables 1-3.  Only the keys that differ from settings.yaml are
# listed; everything else is taken from the defaults in softkite/settings.py.
#
# kite.cd_extra = 0.067 lowers the reel-out glide ratio of the rigid-wing VSM tables
# (6.1) to the value estimated from that flight's data (about 3.6).  Set it to 0.0
# to run the same case with the pure VSM tables.

environment:
  v_wind_ref: 5.9      # measured at 6 m [m/s]
  h_ref: 6.0
  profile_law: log
  z0: 0.07             # roughness length used in the paper [m]

kite:
  m_kcu: 9.0           # total airborne mass 19.6 kg in the paper (wing 10.6 kg)
  cd_extra: 0.067      # flight-calibrated extra drag (see header)

simulation:
  l_tether0: 234.0

control:
  l_min: 234.0         # tether length range of the flight [m]
  l_max: 385.0
  ro_mode: force       # the flight used constant-force reel-out ...
  f_ro: 3000.0         # ... at 3000 N
  f_max: 3600.0
  f_ri: 750.0          # and a 750 N set force during reel-in
  v_ri: 8.0
  f8_azimuth: 18.0     # mean |azimuth| about 10.6 deg in the flight
  f8_elevation: 27.0   # mean elevation about 26.6 deg in the flight
